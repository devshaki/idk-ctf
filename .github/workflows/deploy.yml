name: Challenge Auth
on: [push]

jobs:
  auth-job:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Get CloudFront Domain
        run: |
          echo "=== Fetching Public Domain and Origins ==="
          aws cloudfront list-distributions > cloudfront.json
          cat cloudfront.json
          
          echo "=== Beautiful View of Domains and Routes ==="
          jq '.DistributionList.Items[] | {Domain: .DomainName, Origins: .Origins.Items[] | {Id: .Id, DomainName: .DomainName}}' cloudfront.json || true
