name: Challenge Auth Final Listing Retry
on: [push]

jobs:
  auth-job:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: List Files to Reveal Flag
        run: |
          echo "=== Listing Public Bucket Files ==="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/
