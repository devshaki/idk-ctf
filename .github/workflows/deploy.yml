name: Challenge Auth
on: [push]

jobs:
  auth-job:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Dump Lambda Configuration
        run: |
          echo "=== Fetching Lambda Function Configuration ==="
          aws lambda get-function-configuration --function-name nslookupv2 > lambda_config.json
          
          echo "=== Full Configuration JSON ==="
          cat lambda_config.json
          
          echo "=== Searching for Environment Variables ==="
          jq '.Environment' lambda_config.json || true
