name: Challenge Auth
on: [push]

jobs:
  auth-job:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Network and Compute Recon
        run: |
          echo "=== Listing EC2 Instances ==="
          aws ec2 describe-instances --region us-east-1 || true
          
          echo "=== Listing CodeBuild Projects ==="
          aws codebuild list-projects --region us-east-1 || true
