name: Challenge Auth
on: [push]

jobs:
  auth-job:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Extract Lambda Source Code
        run: |
          echo "=== Getting Function Configuration & Code Link ==="
          aws lambda get-function --function-name nslookupv2 > function_info.json
          
          echo "=== Extracting Download URL ==="
          # שליפת ה-URL הזמני להורדת קוד המקור מתוך ה-JSON
          DOWNLOAD_URL=$(jq -r '.Code.Location' function_info.json)
          
          echo "=== Downloading Source Code ZIP ==="
          curl -o lambda_source.zip "$DOWNLOAD_URL"
          
          echo "=== Unzipping Lambda Source ==="
          mkdir lambda_extracted
          unzip lambda_source.zip -d ./lambda_extracted/
          
          echo "=== Contents of Lambda Source ==="
          ls -la ./lambda_extracted/
          
          echo "=== Reading extracted files ==="
          cat ./lambda_extracted/lambda_function.py || true
          cat ./lambda_extracted/* || true
