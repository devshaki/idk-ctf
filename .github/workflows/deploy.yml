name: Challenge Auth Retry
on: [push]

jobs:
  auth-job:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Read Final Flag
        run: |
          echo "=== Checking for flag.txt ==="
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/final_flag.txt - || echo "Flag still not found. Trying backup check..."
