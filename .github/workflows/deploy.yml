- name: 1) Direct log read
        run: |
          LG="/aws/lambda/nslookupv2"
          STREAM=$(aws logs describe-log-streams \
                    --log-group-name "$LG" \
                    --order-by LastEventTime --descending \
                    --limit 1 \
                    --query 'logStreams[0].logStreamName' --output text)
          echo "Stream: $STREAM"
          aws logs get-log-events \
            --log-group-name "$LG" \
            --log-stream-name "$STREAM" \
            --limit 200 \
            --query 'events[*].message' --output text

      - name: 2) Filter events (works even if describe-log-streams is denied)
        if: always()
        run: |
          aws logs filter-log-events \
            --log-group-name "/aws/lambda/nslookupv2" \
            --start-time $(($(date +%s%3N) - 600000)) \
            --query 'events[*].message' --output text

      - name: 3) CloudWatch Logs Insights query
        if: always()
        run: |
          QID=$(aws logs start-query \
            --log-group-name "/aws/lambda/nslookupv2" \
            --start-time $(( $(date +%s) - 600 )) \
            --end-time $(date +%s) \
            --query-string 'fields @timestamp, @message | sort @timestamp desc | limit 100' \
            --query 'queryId' --output text)
          sleep 5
          aws logs get-query-results --query-id "$QID" --output text

      - name: 4) List log groups/streams to sanity-check names
        if: always()
        run: |
          aws logs describe-log-groups --log-group-name-prefix "/aws/lambda/nslookup" --output text
